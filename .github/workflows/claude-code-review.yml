# Automated Claude Code review on every PR — a second set of eyes alongside
# the in-session QA subagent. Review-only: the workflow token is read-only,
# no github_token is passed, and the only tools granted are the inline-comment
# tool and a few read-only gh/git commands, so the action cannot edit files or push.
#
# Setup (one-time, by the repo owner):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Run `claude setup-token` locally and store the result as the
#      CLAUDE_CODE_OAUTH_TOKEN repository secret (Settings → Secrets and
#      variables → Actions). This bills the owner's Claude subscription, the
#      same setup the ClaudHeer repo uses. To bill API credit instead, store an
#      ANTHROPIC_API_KEY secret and swap the `claude_code_oauth_token` line
#      below for `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
#
# The review is a single-agent prompt (REVIEW_PROMPT below), not the code-review
# plugin. The plugin's recipe launches parallel review subagents and lets the agent
# skip "PRs that do not need review"; run headlessly here it never launched the
# subagents (every run finished in 2-8 turns, under 40s and under $0.20, and then
# posted "No issues found" after skimming one screen of diff), and on large or
# Claude-authored PRs it took the skip path and posted nothing (#83, #85). The prompt
# has no skip path, requires the whole diff to be read, and requires one summary
# comment that lists what was checked, so a rubber stamp is visible as one.
#
# After the action runs, a step checks that the PR carries a comment from the Claude
# app; if not, the review runs once more, and if it is still missing the job fails,
# so a green check always means a review was posted. PRs that change this workflow
# file are exempt: the action refuses to run on them by design.
# On "opened" events the job first waits 90s: reviews started within about a minute of
# the PR being opened reliably ended without a comment, and the same job re-run later
# worked.
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    env:
      REVIEW_PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        Review this pull request and post the result on GitHub.

        Every pull request in this repository gets a full review: PRs written with Claude Code, reverts, probes, PRs whose description says they are throwaway or will not be merged, and PRs that look trivial. Never decide that a PR does not need review, never skip steps, and never finish without posting the summary comment described below.

        How to read the PR:
        1. Run `gh pr view <PR NUMBER> --repo <REPO>` for the title and description. When the description references an issue (for example "Closes #N"), run `gh issue view N --repo <REPO> --comments`: the spec, eng-review and design-review comments on that issue say what the change is supposed to do.
        2. Run `gh pr diff <PR NUMBER> --repo <REPO>` for the full diff. When the output is large it is saved to a file whose path is shown in the result; read that file with the Read tool, in parts if needed, until you have seen every changed file. Do not stop at the first screen of output.
        3. The PR head is already checked out in the working directory. Use Read, and `grep`/`rg` through Bash, there for the context around a change. There is no Xcode on this runner: do not build, run tests or launch a simulator, and do not clone, fetch or check anything out.
        4. Check the change against the conventions in CLAUDE.md and docs/PRD.md, and against DESIGN.md for anything visual or UI (fonts, colors, spacing, motion, copy).
        5. Keep each Bash call to one plain command: no `cd`, pipes, `&&`, `;` or redirects, which are refused here. Read, Grep-style searches and `gh pr diff` are enough.

        What to flag, high signal only:
        - Code that will not compile: syntax errors, type errors, missing imports, unresolved references, Swift concurrency or actor-isolation errors.
        - Logic that produces a wrong result regardless of input, including code that contradicts the doc comment or test that describes it.
        - A clear violation of CLAUDE.md, docs/PRD.md or DESIGN.md where you can quote the rule broken.
        Do not flag code style, naming, nitpicks, pre-existing issues, speculative problems that depend on particular inputs or state, missing tests, or anything you cannot verify from the diff and the checkout. If you are not certain an issue is real, leave it out.

        What to post:
        - One inline comment per finding with `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`), anchored on the changed line. Describe the problem and the fix. Include a committable suggestion block only when committing it fixes the issue completely.
        - Then exactly one summary comment with `gh pr comment <PR NUMBER> --repo <REPO> --body "..."` in this shape:

          ## Code review

          No issues found. (or: Found N issues, each left as an inline comment: one line per issue.)

          Checked: every changed file (list them), plus the context files you read, against CLAUDE.md, docs/PRD.md and DESIGN.md.

        Only comments posted to GitHub count; text returned as a plain message is not seen by anyone.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Let GitHub finish preparing a just-opened PR
        if: github.event.action == 'opened'
        # Measured on #54, #55 and #63: reviews started within ~70s of the PR being opened
        # ended after 2-4 turns with no comment, while the same job re-run minutes later
        # reviewed normally. Waiting before the first attempt avoids burning the retry.
        run: sleep 90
      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          # Read-only tools only. Read is permission-free inside the checkout; the gh and
          # grep commands let the agent fetch the PR, its issue and the diff and search the
          # tree. No write tool, no git write, no github_token.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(grep:*),Bash(rg:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          # Log the full Claude transcript (tool calls, permission denials, subagent results) so a
          # run that posts nothing or rubber-stamps a large PR can be diagnosed from the job log
          # (#85). The repo is private, so the diff appearing in the log is fine.
          show_full_output: true
      - name: Check that a review comment was posted
        id: first_check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The action refuses to run on a PR that changes this workflow file ("must have
          # identical content to the default branch"), so such PRs can never carry a review
          # comment; treat them as skipped rather than retrying or failing.
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
              | grep -qx '.github/workflows/claude-code-review.yml'; then
            echo "::notice::PR #$PR changes this workflow, so the Claude review action skips itself; nothing to verify."
            echo "found=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login | test("^claude(\\[bot\\])?$"))] | length')
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "Claude comments on PR #$PR: $found"
      - name: Review again (first run ended without a comment)
        if: steps.first_check.outputs.found == '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          # Read-only tools only. Read is permission-free inside the checkout; the gh and
          # grep commands let the agent fetch the PR, its issue and the diff and search the
          # tree. No write tool, no git write, no github_token.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(grep:*),Bash(rg:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          # Log the full Claude transcript (tool calls, permission denials, subagent results) so a
          # run that posts nothing or rubber-stamps a large PR can be diagnosed from the job log
          # (#85). The repo is private, so the diff appearing in the log is fine.
          show_full_output: true
      - name: Fail if the review still posted nothing
        if: steps.first_check.outputs.found == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          found=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login | test("^claude(\\[bot\\])?$"))] | length')
          if [ "$found" = "0" ]; then
            echo "::error::The Claude review ran twice and posted no comment on PR #$PR. Re-run the job (gh run rerun) or review manually."
            exit 1
          fi
          echo "Claude comments on PR #$PR after retry: $found"
