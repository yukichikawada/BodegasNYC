<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>A walk in My Bodegas</title>
<meta name="description" content="Open it in the app to see the map.">
<meta property="og:type" content="website">
<meta property="og:title" content="A walk in My Bodegas">
<meta property="og:description" content="Open it in the app to see the map.">
<meta property="og:image" content="https://yukichikawada.github.io/BodegasNYC/walk/icon.png">
<meta property="og:url" content="https://yukichikawada.github.io/BodegasNYC/walk/">
<meta name="twitter:card" content="summary">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    color-scheme: light dark;
    --ground: #FFFFFF;
    --text: #000000;
    --muted: #636366;
    --separator: rgba(60, 60, 67, 0.29);
    --button: #0A7A43;
    --button-text: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #000000;
      --text: #FFFFFF;
      --muted: #98989F;
      --separator: rgba(84, 84, 88, 0.6);
      --button: #34C77B;
      --button-text: #000000;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px;
  }
  .icon {
    display: block;
    width: 64px;
    height: 64px;
    border-radius: 14px;
  }
  h1 {
    margin: 24px 0 8px;
    font-size: 28px;
    font-weight: 800;
    line-height: 1.2;
  }
  p { margin: 0; font-size: 17px; }
  .muted { color: var(--muted); }
  .get {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 24px;
    border-radius: 999px;
    background: var(--button);
    color: var(--button-text);
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
  }
  hr {
    margin: 32px 0 24px;
    border: 0;
    border-top: 1px solid var(--separator);
  }
  h2 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 600;
  }
  .then { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="" width="64" height="64">
  <h1>Someone shared a walk with you.</h1>
  <p class="muted">It opens in My Bodegas on an iPhone.</p>
  <a class="get" href="https://apps.apple.com/app/id6830464647">Get My Bodegas</a>
  <hr>
  <h2>Already have it?</h2>
  <p>Update to the latest version.</p>
  <p class="then">Then go back to the message and tap the link again. If this opened inside another app, open the link in Safari.</p>
</main>
</body>
</html>
